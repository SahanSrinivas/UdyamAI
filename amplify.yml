version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
        # Amplify Console env vars exist during the build but do not flow to the
        # SSR Lambda at runtime. Writing them to .env.production is what makes
        # Next.js pick them up when a request is served.
        #
        # There is no DATABASE_URL any more — the app has no database. The only
        # variable that matters is the Gemini key, and without it the app still
        # works: the vernacular explanation falls back to deterministic offline
        # text and every other surface is unchanged.
        - |
          for var in GOOGLE_API_KEY GEMINI_API_KEY; do
            if [ -n "${!var:-}" ]; then
              echo "${var}=${!var}" >> .env.production
              echo "  ✓ Forwarded ${var}"
            else
              echo "  · ${var} not set at build time"
            fi
          done
    build:
      commands:
        # NEXT_STANDALONE is deliberately NOT set here — Amplify packages the
        # app from stock .next output. Only the container build sets it.
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
      - .next/cache/**/*
